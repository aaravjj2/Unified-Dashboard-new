# Redis Configuration for Alpaca Options Lab
# Optimized for signal pub/sub and order streams

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (append-only for order events)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB snapshots
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# Streams Configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Pub/Sub Configuration
notify-keyspace-events "KEA"

# Performance
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
logfile ""
