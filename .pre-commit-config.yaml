repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.241
    hooks:
      - id: ruff
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: precommit-analyzer
        name: precommit-analyzer
        entry: python3 tools/precommit_analyzer.py
        language: system
        stages: [commit]

      - id: pytest-alpaca
        name: pytest-alpaca-options
        entry: bash -c 'python -m pytest tests/test_alpaca_callbacks.py -v --tb=short -q'
        language: system
        pass_filenames: false
        files: ^financial_dashboard/tabs/options_lab/
        stages: [commit]
