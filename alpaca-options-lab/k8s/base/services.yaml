# API Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: alpaca-options
  labels:
    app: api-server
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-server
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: alpaca-options-sa
      containers:
      - name: api-server
        image: alpaca-options-lab/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: websocket
        envFrom:
        - configMapRef:
            name: alpaca-options-config
        env:
        - name: ALPACA_API_KEY
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: ALPACA_API_KEY
        - name: ALPACA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: ALPACA_SECRET_KEY
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: api-server
              topologyKey: kubernetes.io/hostname
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: alpaca-options
  labels:
    app: api-server
spec:
  selector:
    app: api-server
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: websocket
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
# Trading Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine
  namespace: alpaca-options
  labels:
    app: trading-engine
    component: core
spec:
  replicas: 1  # Single instance for consistency
  selector:
    matchLabels:
      app: trading-engine
  strategy:
    type: Recreate  # Ensure only one instance during updates
  template:
    metadata:
      labels:
        app: trading-engine
        component: core
    spec:
      serviceAccountName: alpaca-options-sa
      containers:
      - name: trading-engine
        image: alpaca-options-lab/trading-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: metrics
        envFrom:
        - configMapRef:
            name: alpaca-options-config
        env:
        - name: ALPACA_API_KEY
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: ALPACA_API_KEY
        - name: ALPACA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: ALPACA_SECRET_KEY
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: trading-data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: trading-data
        persistentVolumeClaim:
          claimName: trading-data-pvc
      - name: logs
        emptyDir: {}
---
# Trading Data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-data-pvc
  namespace: alpaca-options
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
# Strategy Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-engine
  namespace: alpaca-options
  labels:
    app: strategy-engine
    component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: strategy-engine
  template:
    metadata:
      labels:
        app: strategy-engine
        component: core
    spec:
      serviceAccountName: alpaca-options-sa
      containers:
      - name: strategy-engine
        image: alpaca-options-lab/strategy-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: metrics
        envFrom:
        - configMapRef:
            name: alpaca-options-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
---
# ML Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: alpaca-options
  labels:
    app: ml-service
    component: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        component: ml
    spec:
      serviceAccountName: alpaca-options-sa
      containers:
      - name: ml-service
        image: alpaca-options-lab/ml-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          name: http
        envFrom:
        - configMapRef:
            name: alpaca-options-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpaca-options-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ml-models-pvc
---
# ML Models PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
  namespace: alpaca-options
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpaca-options-sa
  namespace: alpaca-options
---
# Role for pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alpaca-options-role
  namespace: alpaca-options
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpaca-options-rolebinding
  namespace: alpaca-options
subjects:
- kind: ServiceAccount
  name: alpaca-options-sa
  namespace: alpaca-options
roleRef:
  kind: Role
  name: alpaca-options-role
  apiGroup: rbac.authorization.k8s.io
