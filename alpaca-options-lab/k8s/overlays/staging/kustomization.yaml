apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alpaca-options-staging

resources:
  - ../base

nameSuffix: -staging

commonLabels:
  environment: staging

replicas:
  - name: api-server
    count: 2
  - name: strategy-engine
    count: 1

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
    target:
      kind: Deployment
      name: api-server
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "10Gi"
    target:
      kind: PersistentVolumeClaim
      name: postgres-pvc

configMapGenerator:
  - name: alpaca-options-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - TRADING_MODE=paper
      - LOG_LEVEL=DEBUG
