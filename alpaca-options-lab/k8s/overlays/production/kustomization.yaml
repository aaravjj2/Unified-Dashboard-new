apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alpaca-options-prod

resources:
  - ../base

nameSuffix: -prod

commonLabels:
  environment: production

replicas:
  - name: api-server
    count: 5
  - name: strategy-engine
    count: 3
  - name: ml-service
    count: 2

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
    target:
      kind: Deployment
      name: api-server
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
    target:
      kind: Deployment
      name: trading-engine
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "100Gi"
    target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "25Gi"
    target:
      kind: PersistentVolumeClaim
      name: redis-pvc

configMapGenerator:
  - name: alpaca-options-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - TRADING_MODE=live
      - LOG_LEVEL=INFO
      - API_RATE_LIMIT=200
