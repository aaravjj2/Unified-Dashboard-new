name: Backend Pipeline CI/CD

on:
  push:
    branches:
      - 'feat/a2-*'
      - 'main'
      - 'develop'
  pull_request:
    branches:
      - 'main'
      - 'develop'
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Test & Validate Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 black
          pip install -r requirements.txt || echo "No requirements.txt at root"
          if [ -f dagster_project/requirements.txt ]; then
            pip install -r dagster_project/requirements.txt
          fi
          # Install data ingestion and ML dependencies
          pip install requests numpy pandas scikit-learn
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 data_ingestion/ ml_model/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 data_ingestion/ ml_model/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true
      
      - name: Format check with black
        run: |
          black --check data_ingestion/ ml_model/ --line-length=120
        continue-on-error: true
      
      - name: Run pytest on pipeline tests
        run: |
          pytest tests/test_pipeline_integrity.py -v --tb=short --maxfail=5
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Run model registry tests
        run: |
          pytest tests/test_model_registry.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/logs/
            test-artifacts/
  
  model-validation:
    name: Model Validation & Metrics
    runs-on: ubuntu-latest
    needs: test-and-validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn
          pip install -r requirements.txt || echo "No requirements.txt at root"
      
      - name: Run model registry tests
        run: |
          pytest tests/test_model_registry.py -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Check model metrics threshold
        run: |
          python -c "
          import sys
          import json
          from pathlib import Path
          
          registry_path = Path('artifacts/model_registry.json')
          if registry_path.exists():
              with open(registry_path) as f:
                  registry = json.load(f)
              if registry:
                  latest = registry[-1]
                  accuracy = latest.get('metrics', {}).get('accuracy', 0)
                  print(f'Latest model accuracy: {accuracy}')
                  if accuracy >= 0.8:
                      print('✅ Model meets accuracy threshold (≥0.8)')
                      sys.exit(0)
                  else:
                      print(f'❌ Model accuracy {accuracy} below threshold 0.8')
                      sys.exit(1)
          else:
              print('⚠️ No registry found, skipping threshold check')
              sys.exit(0)
          "
        continue-on-error: true
      
      - name: Publish metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: |
            artifacts/metrics/*.json
            artifacts/model_registry.json
      
      - name: Tag build as candidate
        if: success()
        run: |
          echo "MODEL_CANDIDATE=true" >> $GITHUB_ENV
          echo "✅ Build tagged as model candidate"
      
  dagster-job-execution:
    name: Execute Dagster Pipeline
    runs-on: ubuntu-latest
    needs: [test-and-validate, model-validation]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/a3-') || startsWith(github.ref, 'refs/heads/feat/a2-') || github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dagster dagster-webserver
          if [ -f dagster_project/requirements.txt ]; then
            pip install -r dagster_project/requirements.txt
          fi
          pip install requests numpy pandas scikit-learn
      
      - name: Set up environment variables
        run: |
          echo "DAGSTER_HOME=${{ github.workspace }}/dagster_home" >> $GITHUB_ENV
          mkdir -p ${{ github.workspace }}/dagster_home
      
      - name: Validate Dagster repository
        working-directory: dagster_project
        run: |
          dagster definitions validate -m dagster_project.repository
      
      - name: Execute market trends pipeline
        working-directory: dagster_project
        run: |
          dagster job execute -m dagster_project.repository -j market_trends_pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        continue-on-error: true
      
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-artifacts
          path: |
            ml_model/artifacts/*.pkl
            ml_model/model_registry.json
            artifacts/models/*.pkl
            artifacts/model_registry.json
            artifacts/metrics/*.json
            logs/model_monitoring/*.log
            dagster_home/
  
  promote-model:
    name: Promote Model to Production
    runs-on: ubuntu-latest
    needs: dagster-job-execution
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download ML artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-artifacts
          path: ./artifacts
      
      - name: Promote best model
        run: |
          python -c "
          import json
          import shutil
          from pathlib import Path
          
          registry_path = Path('artifacts/model_registry.json')
          production_dir = Path('artifacts/production')
          production_dir.mkdir(parents=True, exist_ok=True)
          
          if registry_path.exists():
              with open(registry_path) as f:
                  registry = json.load(f)
              
              # Find best model by accuracy
              best_model = max(registry, key=lambda x: x.get('metrics', {}).get('accuracy', 0))
              
              print(f'Promoting model: {best_model[\"model_name\"]} {best_model[\"version\"]}')
              print(f'Accuracy: {best_model[\"metrics\"][\"accuracy\"]:.4f}')
              
              # Copy to production
              model_path = Path(best_model.get('model_path', ''))
              if model_path.exists():
                  prod_path = production_dir / f'{best_model[\"model_name\"]}_production.pkl'
                  shutil.copy2(model_path, prod_path)
                  print(f'✅ Model promoted to {prod_path}')
              
              # Save production metadata
              prod_metadata = production_dir / 'production_model.json'
              with open(prod_metadata, 'w') as f:
                  json.dump(best_model, f, indent=2)
              print(f'✅ Metadata saved to {prod_metadata}')
          else:
              print('⚠️ No registry found, skipping promotion')
          "
      
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-model
          path: artifacts/production/
      
  build-docker:
    name: Build Dagster Docker Image
    runs-on: ubuntu-latest
    needs: dagster-job-execution
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Dagster image
        working-directory: dagster_project
        run: |
          docker build -t unified-dashboard-dagster:latest .
      
      - name: Save Docker image
        run: |
          docker save unified-dashboard-dagster:latest | gzip > dagster-image.tar.gz
      
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: dagster-image.tar.gz

  deploy-streaming-service:
    name: Deploy Streaming Service
    runs-on: ubuntu-latest
    needs: [test-and-validate, model-validation]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/a3-ml-versioning-monitoring'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build model service Docker image
        run: |
          docker build -f Dockerfile.modelservice -t market-trends-service:latest .
      
      - name: Run streaming service integration tests
        run: |
          # Start the service
          docker compose up -d model_service
          
          # Wait for service to be healthy
          timeout 60 bash -c 'until docker compose exec -T model_service python -c "import requests; requests.get(\"http://localhost:8000/health\")"; do sleep 2; done'
          
          # Run integration tests
          docker compose exec -T model_service pytest tests/test_streaming_client.py -v --tb=short
          
          # Stop the service
          docker compose down
      
      - name: Tag and push Docker image (if deploying)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Docker image built: market-trends-service:latest"
          # In production, this would push to container registry
          # docker tag market-trends-service:latest ${REGISTRY}/market-trends-service:${GITHUB_SHA}
          # docker push ${REGISTRY}/market-trends-service:${GITHUB_SHA}
      
      - name: Deploy to production (if main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying streaming service to production"
          # In production, this would trigger deployment
          # kubectl apply -f k8s/model-service-deployment.yaml
          # or: docker compose up -d model_service
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streaming-test-results
          path: tests/logs/a4_streaming_*.log
