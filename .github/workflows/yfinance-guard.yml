name: yfinance-guard

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  yfinance-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest
      - name: Run yfinance guard test
        run: |
          pytest -q financial_dashboard/tests/unit/test_no_yfinance_repo_wide.py
        env:
          PYTHONPATH: ${{ github.workspace }}
