name: Static Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest

      - name: Run Agent-2A analyzer
        run: |
          python3 tools/analysis/agent2a_analysis.py
          python3 tools/ci_duplicate_id_check.py reports/agent2a/architecture_report.json

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .
