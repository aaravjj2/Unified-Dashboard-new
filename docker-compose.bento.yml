version: '3.8'

services:
  forecast-bento:
    build:
      context: ./bento_services/forecast_service
      dockerfile: Dockerfile  # Generated by `bentoml containerize`
    ports:
      - "5001:5001"
    environment:
      - BENTOML_PORT=5001
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Add model registry service
  # bentoml-yatai:
  #   image: bentoml/yatai:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - YATAI_PORT=3000
